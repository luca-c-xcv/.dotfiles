
# #######################################################################################
# HYPRLAND CONFIG - Minimal Android 16 Style Dark Theme
# #######################################################################################
# Clean, minimal design inspired by Android 16 with dark theme and smooth animations


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = /usr/bin/x-terminal-emulator
$fileManager = /usr/bin/dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# Import the session env into D-Bus/systemd first: otherwise waybar blocks on the
# xdg-desktop-portal timeout (~25s) and swaync may not own the notification bus.
# Wallpaper uses swaybg (CPU/shm buffers): hyprpaper >= 0.8 needs a GPU render node,
# which VMs usually lack (fails with "DRM_IOCTL_MODE_CREATE_DUMB ... permission denied").
exec-once = dbus-update-activation-environment --systemd --all; swaybg -m fill -i ~/.config/hypr/wallpapers/dark_minimal.png & swaync & waybar


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 8

    border_size = 2

    # Material You dark theme colors (Android 16 inspired)
    col.active_border = rgba(8ab4f8ff)
    col.inactive_border = rgba(3f3f3fff)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 16
    rounding_power = 2

    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00000040)
        offset = 0 4
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.15
        popups = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Smooth, minimal curves for Android 16 feel
    bezier = smoothOut,      0.16, 1,    0.3,  1
    bezier = smoothIn,       0.3,  0,    0.84, 0.04
    bezier = easeInOutQuad,  0.45, 0,    0.55, 1

    # Smooth window animations
    animation = global,        1,     4,     smoothOut
    animation = border,        1,     4,     smoothOut
    animation = windows,       1,     4,     smoothOut
    animation = windowsIn,     1,     4,     smoothOut,    popin 80%
    animation = windowsOut,    1,     3,     smoothIn,     popin 80%
    animation = fadeIn,        1,     3,     smoothOut
    animation = fadeOut,       1,     3,     smoothIn
    animation = fade,          1,     3,     smoothOut
    animation = layers,        1,     3,     smoothOut
    animation = layersIn,      1,     3,     smoothOut,    fade
    animation = layersOut,     1,     2,     smoothIn,     fade
    animation = fadeLayersIn,  1,     2,     smoothOut
    animation = fadeLayersOut, 1,     2,     smoothIn
    animation = workspaces,    1,     3,     smoothOut,    fade
    animation = workspacesIn,  1,     2,     smoothOut,    fade
    animation = workspacesOut, 1,     2,     smoothIn,     fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_focuses_monitor = false
    allow_session_lock_restore = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Hide the mouse pointer when unused (replaces unclutter)
cursor {
    inactive_timeout = 5
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$alt = ALT

# Applications
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, gtk-launch $(xdg-settings get default-web-browser)
bind = $mainMod SHIFT, space, exec, $menu
bind = $mainMod SHIFT CTRL, space, exec, wofi --show run
bind = $mainMod CTRL, space, exec, krunner
bind = $mainMod, W, exec, ~/.config/hypr/scripts/window-switcher.sh
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, C, exec, plasma-open-settings
bind = $mainMod SHIFT, B, exec, ~/.config/i3/scripts/ui/browser_selector
bind = $mainMod $alt, L, exec, ~/.config/i3/scripts/ui/rofiLooks
bind = $mainMod SHIFT, RETURN, exec, code
bind = $mainMod SHIFT, L, exec, ~/.config/i3/scripts/ui/openlayout_shortcut
bind = $mainMod SHIFT, E, exec, /home/luca/.local/bin/eclipse
bind = $mainMod SHIFT, G, exec, /opt/smartgit/bin/smartgit.sh
bind = $mainMod CTRL, G, exec, terminator --working-directory=$HOME/Develop/git
bind = $mainMod SHIFT, D, exec, ~/.local/bin/dbeaver
bind = $mainMod CTRL, RETURN, exec, terminator -l LogObject2
bind = $mainMod SHIFT, W, exec, ~/.config/i3/scripts/ui/wacomMapping

# Session
bind = $mainMod SHIFT, P, exec, ~/.config/i3/scripts/ui/powermenu
bind = $mainMod SHIFT, ESCAPE, exec, loginctl lock-session
bind = $mainMod CTRL, ESCAPE, exec, systemctl suspend
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod, I, exec, pkill -SIGUSR1 waybar # toggle bar

# Screenshots
bind = , Print, exec, flameshot gui -c -p $HOME/Pictures/Screenshots/
bind = SHIFT, Print, exec, flameshot screen -c -p $HOME/Pictures/Screenshots/
bind = CTRL, Print, exec, flameshot full

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL, Q, exec, kill -9 $(hyprctl activewindow -j | jq -r '.pid')
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, T, togglegroup, # closest to i3 tabbed layout
bind = $mainMod, V, layoutmsg, preselect d # split vertical
bind = $mainMod, G, layoutmsg, preselect r # split horizontal
bind = $mainMod, BACKSPACE, layoutmsg, togglesplit
bind = $mainMod, P, pseudo, # dwindle

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Move workspace to another monitor
bind = $mainMod CTRL SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL SHIFT, down, movecurrentworkspacetomonitor, d
bind = $mainMod CTRL SHIFT, up, movecurrentworkspacetomonitor, u
bind = $mainMod CTRL SHIFT, right, movecurrentworkspacetomonitor, r

# Next/previous workspace (global and on current monitor)
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod CTRL, TAB, workspace, m+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod CTRL SHIFT, TAB, workspace, m-1

# Scratchpad
bind = $mainMod CTRL, V, togglespecialworkspace, scratchpad
bind = $mainMod CTRL, N, movetoworkspace, special:scratchpad

# Resize mode
bind = $mainMod, R, submap, resize
submap = resize
binde = , left, resizeactive, -4 0
binde = , down, resizeactive, 0 4
binde = , up, resizeactive, 0 -4
binde = , right, resizeactive, 4 0
binde = SHIFT, left, resizeactive, -12 0
binde = SHIFT, down, resizeactive, 0 12
binde = SHIFT, up, resizeactive, 0 -12
binde = SHIFT, right, resizeactive, 12 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Direct resize
binde = $mainMod CTRL $alt, left, resizeactive, -3 0
binde = $mainMod CTRL $alt, down, resizeactive, 0 3
binde = $mainMod CTRL $alt, up, resizeactive, 0 -3
binde = $mainMod CTRL $alt, right, resizeactive, 3 0

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, F1, workspace, 11
bind = $mainMod, F2, workspace, 12
bind = $mainMod, F3, workspace, 13
bind = $mainMod, F4, workspace, 14
bind = $mainMod, F5, workspace, 15
bind = $mainMod, F6, workspace, 16
bind = $mainMod, F7, workspace, 17
bind = $mainMod, F8, workspace, 18
bind = $mainMod, F9, workspace, 19
bind = $mainMod, F10, workspace, 20
bind = $mainMod, F11, workspace, 21
bind = $mainMod, F12, workspace, 22

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, F1, movetoworkspace, 11
bind = $mainMod SHIFT, F2, movetoworkspace, 12
bind = $mainMod SHIFT, F3, movetoworkspace, 13
bind = $mainMod SHIFT, F4, movetoworkspace, 14
bind = $mainMod SHIFT, F5, movetoworkspace, 15
bind = $mainMod SHIFT, F6, movetoworkspace, 16
bind = $mainMod SHIFT, F7, movetoworkspace, 17
bind = $mainMod SHIFT, F8, movetoworkspace, 18
bind = $mainMod SHIFT, F9, movetoworkspace, 19
bind = $mainMod SHIFT, F10, movetoworkspace, 20
bind = $mainMod SHIFT, F11, movetoworkspace, 21
bind = $mainMod SHIFT, F12, movetoworkspace, 22

# Move active window to a workspace and follow it with mainMod + ALT + [0-9 / F1-F12]
bind = $mainMod $alt, 1, movetoworkspace, 1
bind = $mainMod $alt, 2, movetoworkspace, 2
bind = $mainMod $alt, 3, movetoworkspace, 3
bind = $mainMod $alt, 4, movetoworkspace, 4
bind = $mainMod $alt, 5, movetoworkspace, 5
bind = $mainMod $alt, 6, movetoworkspace, 6
bind = $mainMod $alt, 7, movetoworkspace, 7
bind = $mainMod $alt, 8, movetoworkspace, 8
bind = $mainMod $alt, 9, movetoworkspace, 9
bind = $mainMod $alt, 0, movetoworkspace, 10
bind = $mainMod $alt, F1, movetoworkspace, 11
bind = $mainMod $alt, F2, movetoworkspace, 12
bind = $mainMod $alt, F3, movetoworkspace, 13
bind = $mainMod $alt, F4, movetoworkspace, 14
bind = $mainMod $alt, F5, movetoworkspace, 15
bind = $mainMod $alt, F6, movetoworkspace, 16
bind = $mainMod $alt, F7, movetoworkspace, 17
bind = $mainMod $alt, F8, movetoworkspace, 18
bind = $mainMod $alt, F9, movetoworkspace, 19
bind = $mainMod $alt, F10, movetoworkspace, 20
bind = $mainMod $alt, F11, movetoworkspace, 21
bind = $mainMod $alt, F12, movetoworkspace, 22

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bindel = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Floating windows (from i3 for_window rules)
windowrule {
    name = float-apps
    match:class = (?i)^(floating_window|yad|Blueman-manager|Gnome-control-center|Gnome-calculator|Pavucontrol|KeePass2|krunner|Kmix|Klipper|Plasmoidviewer|plasmashell|Plasma)$

    float = yes
}

windowrule {
    name = float-thunderbird-compose
    match:class = (?i)^thunderbird$
    match:title = .*Compose.*

    float = yes
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
