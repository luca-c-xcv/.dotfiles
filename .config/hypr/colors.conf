# Color palette - Android 16 Material You Dark Theme
# Inspired by Material Design 3 on Android 16

# Background colors
$bg_primary = rgba(0c0c0c, 0.95)
$bg_secondary = rgba(1a1a1a, 0.95)
$bg_tertiary = rgba(2a2a2a, 0.95)

# Surface colors
$surface = rgba(12121280)
$surface_dim = rgba(0c0c0c80)
$surface_bright = rgba(2a2a2a80)

# Text colors
$text_primary = #e0e0e0
$text_secondary = #9e9e9e
$text_tertiary = #707070

# Brand color (Blue - inspired by Android 16)
$brand_primary = #8ab4f8
$brand_secondary = #aecbfa
$brand_tertiary = #5fa8ff

# Alert colors
$alert_warning = #ffa500
