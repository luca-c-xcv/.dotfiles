###
## THEME
###

# Impostazioni generali della barra di stato
# General status bar settings
set -g status-justify left
set -g status-style bg=colour235,fg=colour136

# left segment (Session name)
set -g status-left-length 30
set -g status-left "#[bg=colour190,fg=colour235,bold] #S #[bg=colour235,fg=colour190,nobold]"

# Tabs and windows format customization
set -g window-status-format "#[fg=colour244,bg=colour235] #I  #W "
set -g window-status-current-format "#[fg=colour235,bg=colour20]#[fg=colour255,bg=colour20,bold] #I  #W #[fg=colour20,bg=colour235,nobold]"

# Right segment (continuum save status, clock and date)
set -g status-right-length 60
set -g status-right "#[fg=colour20,bg=colour235]#[fg=colour255,bg=colour20,bold]  %H:%M #[fg=colour235,bg=colour20]#[fg=colour255,bg=colour235] %d-%m-%Y "

###
## SETTINGS
###

# enable mouse
set -g mouse on
# enable system clipboard
set -g set-clipboard on
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
# Terminator (VTE) ignores OSC 52, so forward app clipboard writes (e.g. Copilot copy) to X clipboard
set-hook -g pane-set-clipboard "run-shell 'tmux save-buffer - | xclip -selection clipboard -in'"
# Alt+c enters copy-mode without the prefix, so mouse selection works inside Copilot panes
bind-key -n M-c copy-mode

# enable vim-mode keymapping
set -g mode-keys vi

# enable colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Cc"
# alacritty terminfo lacks Ms; declare OSC 52 clipboard and truecolor support
set -as terminal-features ",alacritty*:clipboard:RGB"

# Prefix
set -g prefix M-Space
unbind C-b
bind M-Space send-prefix


# Pane navigation
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Pane resizing
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Down  resize-pane -D 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

# Pane splitting
bind M-h split-window -v
bind M-v split-window -h

# new tab
bind t new-window 

# Show time
bind M-t clock-mode

# new session
bind c new-session

# unbind zoom
unbind z
unbind f
# bind fullssize
bind f resize-pane -Z

###
## FZF
###

# Prefix + s: fuzzy switch session; Prefix + w: fuzzy switch window (all sessions)
bind s display-popup -E -w 60% -h 50% "tmux list-sessions -F '#S' | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
bind w display-popup -E -w 70% -h 50% "tmux list-windows -a -F '#S:#I #W' | fzf --reverse --prompt='window> ' | cut -d' ' -f1 | xargs -r tmux switch-client -t"
# Prefix + p: pick text from the current pane and paste it
# bind p display-popup -E -w 80% -h 60% "tmux capture-pane -p -J -S -3000 | tr -s ' ' '\n' | awk 'length>2 && !s[\$0]++' | fzf --reverse --prompt='paste> ' | tr -d '\n' | tmux load-buffer - && tmux paste-buffer"

###
## PLUGINS 
###

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'luca-c-xcv/tmux-skeeper'
#set -g @plugin 'tmux-plugins/tmux-resurrect' # save-restore sessions
#set -g @plugin 'tmux-plugins/tmux-continuum' # automatically handle the session save


# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
